# Character metadata — source of truth for all localization pipelines.
# Fields:
#   source_name : display name as it appears in English source
#   full_name   : full canonical name (for reference only)
#   gender      : male | female | non-binary
#   pronouns    : pronouns to use when referring to this character
#   role        : short description of character role
#   names       : per-language display name overrides (token [mcname] stays as-is)
#   notes       : any extra context useful for translators

